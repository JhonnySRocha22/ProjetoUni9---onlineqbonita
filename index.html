<h1>Como será o Carrossel</h1>

<div class="product-card">

<img class="hoodie"src="imagens/hoodiefembranco.jpg" >
  <h2>Moletom Hoodie Branco</h2>
  <p class="preco">Preço: R$ 299,00</p>
  <p><em>Limite de 5 unidades por cliente</em></p>

  <label for="quantity">Quantidade:</label>
  <input 
    type="number" 
    id="quantity" 
    value="1" 
    min="1" 
    max="5"
  >
  
  <button id="add-to-cart-btn">Adicionar ao Carrinho</button>
  <p id="error-message" style="color: red; display: none;"></p>
</div>

<script>
  const MAX_LIMIT = 5;
  const quantityInput = document.getElementById('quantity');
  const addToCartBtn = document.getElementById('add-to-cart-btn');
  const errorMessage = document.getElementById('error-message');

  // Trava a alteração direta via campo numérico
  quantityInput.addEventListener('input', () => {
    let currentVal = parseInt(quantityInput.value, 10);

    if (currentVal > MAX_LIMIT) {
      quantityInput.value = MAX_LIMIT;
      showError(`Você só pode comprar no máximo ${MAX_LIMIT} unidades deste produto.`);
    } else if (currentVal < 1 || isNaN(currentVal)) {
      quantityInput.value = 1;
      clearError();
    } else {
      clearError();
    }
  });

  // Validação ao clicar no botão de compra
  addToCartBtn.addEventListener('click', () => {
    const selectedQuantity = parseInt(quantityInput.value, 10);

    if (selectedQuantity > MAX_LIMIT) {
      showError(`Limite excedido! O máximo permitido é ${MAX_LIMIT}.`);
      return;
    }

    alert(`Sucesso! ${selectedQuantity} item(ns) adicionado(s) ao carrinho.`);
  });

  function showError(msg) {
    errorMessage.textContent = msg;
    errorMessage.style.display = 'block';
  }

  function clearError() {
    errorMessage.textContent = '';
    errorMessage.style.display = 'none';
  }
</script>






















































































</body>
</html>
